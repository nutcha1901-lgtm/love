<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>มีอะไรจะบอก 💗</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffd6e7, #fff0f5);
    font-family: sans-serif;
    text-align: center;
}

.card {
    background: white;
    padding: 35px;
    border-radius: 25px;
    width: 300px;
    box-shadow: 0 5px 25px #e99abf;
}

.heart {
    font-size: 65px;
    animation: beat 1s infinite;
}

@keyframes beat {
    50% { transform: scale(1.2); }
}

h1 { color: #ff5c9a; }

p {
    color: #777;
    line-height: 1.8;
}

button {
    background: #ff70a6;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 16px;
    margin: 5px;
}

button:hover {
    background: #ff4081;
}
</style>
</head>

<body>

<div class="card">
    <div class="heart">💗</div>
    <h1>มีอะไรจะบอก...</h1>

    <button onclick="love()">อยากรู้ 💕</button>

    <p id="answer"></p>
</div>

<script>
function love() {
    document.getElementById("answer").innerHTML =
    "คิดถึงนะค้าบ ตั้งใจทำงานนะไอ้เด็กน้อย  💓🫶";
}
</script>

</body>
</html>
