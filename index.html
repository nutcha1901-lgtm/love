<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ถึงตุ้ย ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            text-align: center;

            background: linear-gradient(135deg, #ff9a9e, #fad0c4);

            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 600px;

            padding: 45px 25px;

            background: rgba(255, 255, 255, 0.45);

            border-radius: 30px;

            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);

            backdrop-filter: blur(10px);
        }

        .heart {
            font-size: 80px;

            animation: beat 1s infinite;
        }

        h1 {
            color: #ff477e;

            font-size: 38px;

            margin: 10px 0 25px;
        }

        p {
            color: #6b2942;

            font-size: 21px;

            line-height: 2;
        }

        button {
            margin-top: 15px;

            padding: 15px 30px;

            border: none;

            border-radius: 50px;

            background: #ff477e;

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }

        #message {
            margin-top: 25px;

            color: #ff477e;

            font-size: 21px;

            font-weight: bold;

            line-height: 2;
        }

        @keyframes beat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        .floating-heart {
            position: fixed;

            bottom: -50px;

            font-size: 25px;

            animation: floatUp 4s linear forwards;

            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heart">❤️</div>

        <h1>ถึงตุ้ย คนพิเศษของเค้า 💕</h1>

        <p>
            รักเธอที่สุดเลยนะ ❤️🥰<br>
            อยู่ด้วยกันไปนาน ๆ นะ 💕
        </p>

        <button onclick="showLove()">
            💌 กดตรงนี้สิ
        </button>

        <div id="message"></div>

    </div>


    <script>
        function showLove() {

            document.getElementById("message").innerHTML =
                "ขอบคุณที่เข้ามาเป็นความสุขในชีวิตของเค้านะตุ้ย ❤️<br>" +
                "ถึงเค้าอาจจะไม่ใช่คนที่ดีที่สุด<br>" +
                "แต่เค้าจะรักและดูแลตุ้ยให้ดีที่สุดนะ<br>" +
                "ขอโทษที่ชวนทะเลาะบ่อยนะ 🥺<br>" +
                "รักที่สุดเลยยยย ❤️🥰";

            for (let i = 0; i < 30; i++) {

                const heart = document.createElement("div");

                heart.className = "floating-heart";

                heart.innerHTML = "❤️";

                heart.style.left =
                    Math.random() * 100 + "vw";

                heart.style.fontSize =
                    (Math.random() * 25 + 15) + "px";

                heart.style.animationDuration =
                    (Math.random() * 2 + 3) + "s";

                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }
        }
    </script>

</body>
</html>
